<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3e9">
  <title>Kahwin Cam</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><path d="M9 12.5a3 3 0 0 1 5.2-1.6M15 13.5a3 3 0 0 1-5.2 1.6"/><path d="M14.5 9v2h-2M9.5 17v-2h2"/></symbol>
    <symbol id="i-gallery" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  </svg>

  <!-- HOME -->
  <section id="home" class="screen active">
    <button class="icon-btn music-toggle floating" aria-label="Muzik">
      <svg><use href="#i-music"/></svg><span class="slash"></span>
    </button>
    <div class="card">
      <p class="eyebrow" data-text="eyebrow"></p>
      <h1 class="couple" data-text="couple"></h1>
      <p class="date" data-text="dateText"></p>
      <div class="divider"><span></span></div>
      <p class="intro">Tangkap kenangan majlis dari pandangan anda. Setiap gambar terus sampai kepada pengantin. 💌</p>
      <label class="field">
        <span>Nama anda (pilihan)</span>
        <input id="guestName" maxlength="40" autocomplete="name" placeholder="cth. Mak Long Kiah">
      </label>
      <button id="startBtn" class="btn primary" disabled>Mula Ambil Gambar</button>
      <button id="mineBtn" class="btn link">Gambar saya (<span id="mineCount">0</span>)</button>
    </div>
    <p class="hashtag" data-text="hashtag"></p>
  </section>

  <!-- CAMERA -->
  <section id="camera" class="screen">
    <header class="topbar">
      <button id="camBack" class="icon-btn" aria-label="Kembali"><svg><use href="#i-back"/></svg></button>
      <div id="progress" class="progress"></div>
      <div class="topbar-right">
        <button class="icon-btn music-toggle" aria-label="Muzik"><svg><use href="#i-music"/></svg><span class="slash"></span></button>
        <button id="flipBtn" class="icon-btn" aria-label="Tukar kamera"><svg><use href="#i-flip"/></svg></button>
      </div>
    </header>

    <div id="stage" class="stage">
      <div id="viewfinder" class="viewfinder">
        <video id="video" playsinline muted autoplay></video>
        <div id="countdown" class="countdown"></div>
        <div id="flash" class="flash"></div>
        <div id="camError" class="cam-error" hidden><p></p></div>
      </div>
    </div>

    <div id="panel" class="panel">
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="frame" role="tab">Bingkai</button>
        <button class="tab" data-tab="filter" role="tab">Penapis</button>
        <button class="tab" data-tab="layout" role="tab">Susunan</button>
      </div>
      <div class="options" id="opt-frame"></div>
      <div class="options" id="opt-filter" hidden></div>
      <div class="options" id="opt-layout" hidden></div>
      <div class="controls">
        <button id="galleryBtn" class="round-btn" aria-label="Pilih dari galeri"><svg><use href="#i-gallery"/></svg></button>
        <button id="shutterBtn" class="shutter" aria-label="Ambil gambar"></button>
        <button id="resetBtn" class="round-btn" aria-label="Mula semula"><svg><use href="#i-reset"/></svg></button>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <header class="topbar">
      <button id="resBack" class="icon-btn" aria-label="Laman utama"><svg><use href="#i-back"/></svg></button>
      <h2>Gambar anda</h2>
      <button class="icon-btn music-toggle" aria-label="Muzik"><svg><use href="#i-music"/></svg><span class="slash"></span></button>
    </header>
    <div class="result-stage"><img id="resultImg" alt="Gambar yang diambil"></div>
    <p id="uploadStatus" class="status" aria-live="polite"></p>
    <div class="actions">
      <button id="retryBtn" class="btn gold" hidden>Cuba hantar semula</button>
      <div class="row">
        <button id="saveBtn" class="btn primary">Simpan ke telefon</button>
        <button id="againBtn" class="btn">Ambil lagi</button>
      </div>
      <button id="deleteBtn" class="btn danger" hidden>Padam gambar ini</button>
    </div>
  </section>

  <!-- MY PHOTOS -->
  <section id="mine" class="screen">
    <header class="topbar">
      <button id="mineBack" class="icon-btn" aria-label="Kembali"><svg><use href="#i-back"/></svg></button>
      <h2>Gambar saya</h2>
      <button class="icon-btn music-toggle" aria-label="Muzik"><svg><use href="#i-music"/></svg><span class="slash"></span></button>
    </header>
    <p class="hint">Gambar yang dihantar dari telefon ini sahaja. Anda boleh padam gambar anda sendiri.</p>
    <div id="mineGrid" class="mine-grid"></div>
  </section>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/frames.js"></script>
  <script src="js/music.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
