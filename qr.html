<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kahwin Cam QR</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --gold: #b38b4d; --gold-2: #d9bf8c; --ink: #3d3229; --muted: #8a7b6b; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: "Poppins", system-ui, sans-serif; color: var(--ink); background: #f3eee4; padding: 20px 16px; }
    .controls { max-width: 760px; margin: 0 auto 20px; display: grid; gap: 10px; }
    .controls label { font-size: .8rem; color: var(--muted); }
    .controls input { width: 100%; padding: 10px 12px; border: 1px solid #ddd0b8; border-radius: 10px; font: inherit; }
    .controls .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    .controls .row > * { flex: 1 1 140px; }
    .controls button { padding: 11px 18px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font: inherit; cursor: pointer; }
    .sheet { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .tag { background: #fffdf8; border: 1px solid var(--gold-2); outline: 1px solid var(--gold-2); outline-offset: -8px; padding: 22px 16px; text-align: center; break-inside: avoid; }
    .tag .eyebrow { font-family: "Cormorant Garamond", serif; font-weight: 600; letter-spacing: .25em; font-size: .65rem; text-transform: uppercase; color: var(--gold); }
    .tag .couple { font-family: "Great Vibes", cursive; font-size: 1.9rem; color: var(--gold); margin: 2px 0 8px; line-height: 1.2; }
    .tag .qr { display: inline-block; padding: 6px; background: #fff; }
    .tag .qr img, .tag .qr canvas { display: block; width: 120px; height: 120px; }
    .tag .cta { font-size: .72rem; margin-top: 8px; line-height: 1.45; }
    .tag .date { font-family: "Cormorant Garamond", serif; font-size: .85rem; color: var(--muted); margin-top: 4px; }
    @media (max-width: 480px) { .sheet { grid-template-columns: 1fr; } }
    @media print {
      body { background: #fff; padding: 0; }
      .controls { display: none; }
      .sheet { grid-template-columns: repeat(2, 1fr); gap: 8mm; max-width: none; }
      @page { size: A4; margin: 10mm; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <div>
      <label for="url">Pautan Kahwin Cam (GitHub Pages)</label>
      <input id="url">
    </div>
    <div class="row">
      <div>
        <label for="count">Bilangan tag</label>
        <input id="count" type="number" min="1" max="40" value="8">
      </div>
      <button id="print">Cetak</button>
    </div>
  </div>
  <div id="sheet" class="sheet"></div>

  <script src="js/config.js"></script>
  <script>
    const CFG = window.KAHWIN_CONFIG || {};
    const urlInput = document.getElementById('url');
    const countInput = document.getElementById('count');
    const sheet = document.getElementById('sheet');
    urlInput.value = new URL('./', location.href).href;

    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

    function render() {
      sheet.innerHTML = '';
      const n = Math.max(1, Math.min(40, Number(countInput.value) || 1));
      for (let i = 0; i < n; i++) {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.innerHTML = `
          <p class="eyebrow">${esc(CFG.eyebrow || 'Walimatul Urus')}</p>
          <p class="couple">${esc(CFG.couple)}</p>
          <div class="qr"></div>
          <p class="cta">Imbas &amp; ambil gambar untuk pengantin 📸<br>Tiada app, tiada login.</p>
          <p class="date">${esc(CFG.dateText)}</p>`;
        sheet.append(tag);
        if (window.QRCode) {
          new QRCode(tag.querySelector('.qr'), {
            text: urlInput.value, width: 240, height: 240,
            colorDark: '#3d3229', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M,
          });
        } else {
          tag.querySelector('.qr').textContent = urlInput.value;
        }
      }
    }

    urlInput.addEventListener('input', render);
    countInput.addEventListener('input', render);
    document.getElementById('print').onclick = () => window.print();
    document.fonts.ready.then(render);
  </script>
</body>
</html>
